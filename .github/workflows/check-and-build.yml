name: Check and build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  APP_NAME: "DocGenerator"

jobs:
  ci:
    name: Basic checks
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Check Python files
        run: |
          python -m compileall -q main.py widgets.py
          ruff check main.py widgets.py --select E9,F63,F7,F82

  build:
    name: Build for ${{ matrix.platform }}
    needs: ci

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            package_path: DocGenerator-Linux.tar.gz

          - platform: Windows
            os: windows-latest
            package_path: DocGenerator-Windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install PyInstaller

      - name: Build application
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          DocGenerator.spec

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "${{ matrix.package_path }}" \
            -C dist \
            "${{ env.APP_NAME }}"

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/${{ env.APP_NAME }}" `
            -DestinationPath "${{ matrix.package_path }}"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          path: "${{ matrix.package_path }}"
          archive: false
