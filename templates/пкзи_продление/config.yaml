id: pkzi_extension
title: Продление_ПКЗИ
file: ПКЗИ_продление_шаблон.docx

output_name: "{title}_{employee_full_name}_{current_date}.docx"

fields:
  employee_full_name:
    label: ФИО подключаемого пользователя
    required: true
    type: catalog_select

  department:
    label: Название отдела / заказчик работ
    required: true
    type: text

  employee_job_role:
    label: Должность подключаемого пользователя
    required: true
    type: text

  emp_phone:
    label: Телефон подключаемого пользователя (xx-xx)
    required: true
    type: text

  order_num:
    label: Номер приказа (3 цифры)
    required: true
    type: text

  order_date:
    label: Дата приказа
    required: true
    type: date

  cert_name:
    label: Имя сертификата
    required: false
    type: text

  supervisor_job_role:
    label: Должность руководителя / заказчик работ
    required: true
    type: text

  supervisor_full_name:
    label: ФИО руководителя / заказчик работ
    required: true
    type: text

  sup_phone:
    label: Телефон руководителя (xx-xx)
    required: true
    type: text

  begin_date:
    label: Начальная дата
    required: true
    type: date

  end_date:
    label: Конечная дата
    required: true
    type: date

  email:
    label: Адрес электронной почты
    required: true
    type: text
